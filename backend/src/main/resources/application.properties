spring.application.name=drivenest

# Optional: load ../.env when running from /backend (real env vars still win)
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/drivenest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:drivenest}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is owned by Flyway; Hibernate only validates it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
