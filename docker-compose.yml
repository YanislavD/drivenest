services:
  db:
    image: postgres:17
    container_name: drivenest-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drivenest}
      POSTGRES_USER: ${POSTGRES_USER:-drivenest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - drivenest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  drivenest-db-data:

